name: Atualizar Página SVG (Asteroid Defense)

on:
  # a cada 6 horas (o gráfico do GitHub pode demorar um pouco para refletir novos commits)
  schedule:
    - cron: '30 */6 * * *'
  # sempre que você der push na branch principal (ignora mudanças só em assets/)
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
  # botão "Run workflow" na aba Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asteroid-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar todas as seções SVG da página
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/build_page.py <<'PYEOF'
          #!/usr/bin/env python3
          """Gera a pagina inteira do perfil em SVG, a partir da API do GitHub (sem servicos de terceiros).

          Arquivos gerados em assets/: header, pilot, arsenal, conquests, rules, asteroid-counter, radar, trophies,
          battle-map, missions, footer e os botoes btn-*.svg. Tambem atualiza a lista de links das missoes no README
          (entre <!-- MISSOES:START --> e <!-- MISSOES:END -->).

          Regras do jogo:
            - 1 contribuicao (quadradinho/commit) = 1 asteroide destruido = +100 pontos
            - 7+ dias seguidos  -> combo x2  (vale para as contribuicoes da sequencia atual)
            - 30+ dias seguidos -> combo x5  (vale para as contribuicoes da sequencia atual)
            - 1 estrela recebida (nos repositorios proprios) = +500 pontos

          O texto da pagina (nome, bio, conquistas, tecnologias...) vem de profile.json (opcional).
          Teste local sem token:  COUNTER_OVERRIDE=62 COUNTER_STARS=0 COUNTER_STREAK=1 python3 build_page.py
          """
          import datetime
          import json
          import math
          import os
          import random
          import re
          import urllib.request

          OWNER = os.environ.get("GITHUB_REPOSITORY_OWNER", "RyanHenrique20")
          OUT_COUNTER = os.environ.get("COUNTER_OUT", "assets/asteroid-counter.svg")
          OUT_MAP = os.environ.get("MAP_OUT", "assets/battle-map.svg")
          README = os.environ.get("COUNTER_README", "README.md")

          PTS_PER_ASTEROID = 100
          PTS_PER_STAR = 500

          # (minimo de asteroides, nivel, patente)
          LEVELS = [
              (0, 1, "CADETE ESPACIAL"),
              (100, 2, "PILOTO DE COMBATE"),
              (500, 3, "CAPITAO DA FROTA"),
              (1000, 4, "COMANDANTE ESTELAR"),
              (2500, 5, "ALMIRANTE DO ESPACO PROFUNDO"),
          ]
          MESES = ["JAN", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT", "NOV", "DEZ"]

          DEFS = ('<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.9" result="b"/>'
                  '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
                  '<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#fff" opacity="0.06"/></pattern></defs>')


          # --------------------------------------------------------------------------- dados
          PAGE_DIR = os.environ.get("PAGE_DIR", "assets")
          PROFILE = os.environ.get("PROFILE_JSON", "profile.json")


          def gql(query, variables):
              token = os.environ["GH_TOKEN"]
              body = json.dumps({"query": query, "variables": variables}).encode()
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=body,
                  headers={"Authorization": f"bearer {token}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              if "errors" in data:
                  raise SystemExit(f"Erro GraphQL: {data['errors']}")
              return data["data"]


          def compute_streaks(weeks):
              days = sorted((d for w in weeks for d in w), key=lambda d: d["date"])
              longest = run = 0
              for d in days:
                  if d["contributionCount"] > 0:
                      run += 1
                      longest = max(longest, run)
                  else:
                      run = 0
              cur_days = days[:-1] if days and days[-1]["contributionCount"] == 0 else days  # hoje zerado nao quebra
              streak = streak_c = 0
              for d in reversed(cur_days):
                  if d["contributionCount"] > 0:
                      streak += 1
                      streak_c += d["contributionCount"]
                  else:
                      break
              return streak, streak_c, longest


          def aggregate_langs(repos):
              agg = {}
              for r in repos:
                  for e in ((r.get("languages") or {}).get("edges") or []):
                      name = e["node"]["name"]
                      agg[name] = agg.get(name, 0) + e["size"]
              return sorted(agg.items(), key=lambda kv: -kv[1])


          def fake_data():
              """Dados de mentira, so para testar o visual localmente."""
              rnd = random.Random(3)
              today = datetime.date.today()
              start = today - datetime.timedelta(days=364)
              start -= datetime.timedelta(days=(start.weekday() + 1) % 7)  # volta ate o domingo
              weeks, d = [], start
              while d <= today:
                  week = []
                  for _ in range(7):
                      if d <= today:
                          c = rnd.choice([0, 0, 0, 0, 1, 1, 2, 3, 5, 8]) if rnd.random() < 0.5 else 0
                          week.append({"date": d.isoformat(), "weekday": (d.weekday() + 1) % 7, "contributionCount": c})
                      d += datetime.timedelta(days=1)
                  weeks.append(week)
              now = datetime.datetime.now(datetime.timezone.utc).isoformat()
              repos = [
                  {"name": "projeto-exemplo", "description": "Descricao de teste | com pipe e um texto bem longo para testar a quebra de linha",
                   "url": "https://github.com/x/y", "stargazerCount": 2, "isArchived": False, "pushedAt": now,
                   "primaryLanguage": {"name": "JavaScript"},
                   "languages": {"edges": [{"size": 5200, "node": {"name": "JavaScript"}}, {"size": 2100, "node": {"name": "CSS"}}, {"size": 900, "node": {"name": "HTML"}}]}},
                  {"name": "site-antigo-com-nome-bem-comprido-demais", "description": None, "url": "https://github.com/x/z",
                   "stargazerCount": 0, "isArchived": False, "pushedAt": "2026-05-01T10:00:00Z", "primaryLanguage": None,
                   "languages": {"edges": [{"size": 3000, "node": {"name": "PHP"}}]}},
                  {"name": "jogo-c", "description": "Um joguinho em C", "url": "https://github.com/x/w", "stargazerCount": 1,
                   "isArchived": True, "pushedAt": "2025-12-01T10:00:00Z", "primaryLanguage": {"name": "C"},
                   "languages": {"edges": [{"size": 1500, "node": {"name": "C"}}]}},
              ]
              return weeks, repos


          def fetch():
              if os.environ.get("COUNTER_OVERRIDE"):
                  total = int(os.environ["COUNTER_OVERRIDE"])
                  stars = int(os.environ.get("COUNTER_STARS", "0"))
                  streak = int(os.environ.get("COUNTER_STREAK", "0"))
                  streak_c = min(total, int(os.environ.get("COUNTER_STREAK_CONTRIB", str(streak))))
                  weeks, repos = fake_data()
                  s = dict(total=total, stars=stars, streak=streak, streak_c=streak_c,
                           longest=int(os.environ.get("COUNTER_LONGEST", str(max(streak, 5)))),
                           weeks=weeks, repos=repos, followers=3, commits=int(total * 0.9), prs=4, issues=1, reviews=0,
                           repo_count=len(repos), langs=aggregate_langs(repos))
                  if os.environ.get("COUNTER_PLACEHOLDER"):
                      for w in weeks:
                          for d in w:
                              d["contributionCount"] = 0
                      s.update(repos=[], followers=0, commits=0, prs=0, issues=0, reviews=0, repo_count=0, langs=[], longest=0)
                  return s

              q = """
              query($login:String!){
                user(login:$login){
                  followers{totalCount}
                  contributionsCollection{
                    totalCommitContributions
                    totalPullRequestContributions
                    totalIssueContributions
                    totalPullRequestReviewContributions
                    contributionCalendar{
                      totalContributions
                      weeks{contributionDays{date weekday contributionCount}}
                    }
                  }
                  repositories(first:100, ownerAffiliations:OWNER, isFork:false, privacy:PUBLIC,
                               orderBy:{field:PUSHED_AT, direction:DESC}){
                    totalCount
                    nodes{
                      name description url stargazerCount isArchived pushedAt primaryLanguage{name}
                      languages(first:6, orderBy:{field:SIZE, direction:DESC}){edges{size node{name}}}
                    }
                  }
                }
              }"""
              u = gql(q, {"login": OWNER})["user"]
              cc = u["contributionsCollection"]
              cal = cc["contributionCalendar"]
              repos = u["repositories"]["nodes"]
              weeks = [w["contributionDays"] for w in cal["weeks"]]
              streak, streak_c, longest = compute_streaks(weeks)
              return dict(total=cal["totalContributions"], stars=sum(r["stargazerCount"] for r in repos),
                          streak=streak, streak_c=streak_c, longest=longest, weeks=weeks, repos=repos,
                          followers=u["followers"]["totalCount"], commits=cc["totalCommitContributions"],
                          prs=cc["totalPullRequestContributions"], issues=cc["totalIssueContributions"],
                          reviews=cc["totalPullRequestReviewContributions"], repo_count=u["repositories"]["totalCount"],
                          langs=aggregate_langs(repos))


          # --------------------------------------------------------------------------- perfil (editavel em profile.json)
          DEFAULT_PROFILE = {
              "nome": "Ryan Henrique",
              "subtitulo": "Piloto Web em Treinamento · Asteroid Defense Unit",
              "local": "São Paulo · Brasil",
              "typing": ["Estudante na UNICID", "Apaixonado por tecnologia", "Aprendendo e evoluindo todo dia",
                         "Cada commit = 1 asteroide destruído"],
              "ficha": [["PILOTO", "Ryan Henrique"], ["IDADE", "23 ciclos solares"], ["BASE", "São Paulo, Terra"],
                        ["ACADEMIA", "UNICID"], ["MISSÃO", "Tornar-se Desenvolvedor Web"], ["COMBUSTÍVEL", "café + curiosidade"]],
              "bio": [
                  "Fala! Eu sou o Ryan, tenho 23 anos, moro em São Paulo e estudo na UNICID. A tecnologia me conquistou de um jeito que virou rotina: gosto de entender como as coisas funcionam por baixo, construir projetos do zero e aprender com cada erro no caminho.",
                  "Aqui no GitHub você acompanha meus projetos e a minha evolução como desenvolvedor.",
              ],
              "bullets": ["Cursando na UNICID", "Aprendendo e praticando todos os dias", "Foco em me tornar Desenvolvedor Web",
                          "Vamos conversar? Me chama no LinkedIn ou por e-mail"],
              "techs": [
                  {"nome": "HTML", "slot": "ESCUDO"}, {"nome": "CSS", "slot": "ESCUDO"},
                  {"nome": "JAVASCRIPT", "slot": "LASER PRIMARIO"}, {"nome": "PHP", "slot": "CANHAO DE PLASMA"},
                  {"nome": "LARAVEL", "slot": "CANHAO DE PLASMA"}, {"nome": "PYTHON", "slot": "MISSEIS"},
                  {"nome": "C", "slot": "MISSEIS"}, {"nome": "MYSQL", "slot": "BANCO DE MUNICAO"},
                  {"nome": "GIT", "slot": "NAVEGACAO"}, {"nome": "GITHUB", "slot": "BASE ORBITAL"},
                  {"nome": "VS CODE", "slot": "PAINEL DE COMANDO"},
              ],
              "rank": "RECRUTA ESPACIAL",
              "conquistas": [
                  {"nome": "Escudo Forjado", "meta": "HTML & CSS", "req": "Montar páginas completas do zero", "pct": 100},
                  {"nome": "Navegador Estelar", "meta": "Git & GitHub", "req": "Dominar commits, branches e PRs", "pct": 100},
                  {"nome": "Laser Calibrado", "meta": "JavaScript", "req": "Criar projetos interativos sozinho", "pct": 70},
                  {"nome": "Canhão de Plasma", "meta": "PHP + Laravel", "req": "Subir uma aplicação full-stack", "pct": 60},
                  {"nome": "Míssil Teleguiado", "meta": "Python", "req": "Automatizar tarefas e scripts", "pct": 40},
                  {"nome": "Piloto Full-Stack", "meta": "Front-End → Full-Stack", "req": "Unir front + back em um projeto real", "pct": 0},
                  {"nome": "Mestre dos Arcades", "meta": "Desenvolvimento de Games", "req": "Publicar um jogo jogável", "pct": 0},
                  {"nome": "Engenheiro de Nave", "meta": "Sistemas Operacionais", "req": "Entender Linux a fundo", "pct": 0},
                  {"nome": "Comunicador Universal", "meta": "Inglês", "req": "Ler documentação e conversar em EN", "pct": 50},
                  {"nome": "Hangar Lotado", "meta": "Portfólio", "req": "5+ projetos públicos no GitHub", "pct": 30},
                  {"nome": "Base Orbital Própria", "meta": "Homelab", "req": "Montar um servidor caseiro rodando 24/7", "pct": 0},
                  {"nome": "CHEFÃO FINAL", "meta": "Dev Web Pleno", "req": "Desbloquear TODAS as conquistas acima", "pct": 0},
              ],
          }


          def load_profile():
              p = json.loads(json.dumps(DEFAULT_PROFILE))
              if os.path.exists(PROFILE):
                  try:
                      p.update(json.load(open(PROFILE, encoding="utf-8")))
                  except Exception as e:  # json quebrado nao pode derrubar a Action
                      print(f"(profile.json invalido, usando o padrao: {e})")
              return p


          # --------------------------------------------------------------------------- regras
          def combo_mult(streak):
              return 5 if streak >= 30 else 2 if streak >= 7 else 1


          def level_info(n):
              cur = LEVELS[0]
              for lv in LEVELS:
                  if n >= lv[0]:
                      cur = lv
              idx = LEVELS.index(cur)
              return cur, (LEVELS[idx + 1] if idx + 1 < len(LEVELS) else None)


          # --------------------------------------------------------------------------- 1) placar
          def build_counter(s):
              total, stars, streak, streak_c = s["total"], s["stars"], s["streak"], s["streak_c"]
              mult = combo_mult(streak)
              points = (total - streak_c) * PTS_PER_ASTEROID + streak_c * PTS_PER_ASTEROID * mult + stars * PTS_PER_STAR

              D, COUNT_T = 8.0, 3.0
              steps = min(points // 100, 60) if points else 0
              values = [round(i * points / steps) for i in range(steps + 1)] if steps else [points]
              dt = COUNT_T / max(len(values) - 1, 1)

              cur, nxt = level_info(total)
              _, lvl, rank = cur
              if nxt:
                  frac = (total - cur[0]) / (nxt[0] - cur[0])
                  prox = f"PROXIMO NIVEL: FALTAM {nxt[0] - total} ASTEROIDES"
              else:
                  frac, prox = 1.0, "NIVEL MAXIMO!"
              cells, filled = 20, int(frac * 20)

              today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
              k = lambda t: f"{min(max(t / D, 0), 1):.4f}"
              fmt = lambda v: f"{v:06d}"
              o = ['<?xml version="1.0" encoding="UTF-8"?>',
                   '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140" font-family="Courier New, Courier, monospace">',
                   DEFS,
                   '<rect width="800" height="140" fill="#000"/>',
                   '<rect x="2" y="2" width="796" height="136" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>']

              pts = " ".join(f"{x},{y}" for x, y in [(-24, -8), (-12, -26), (6, -22), (26, -6), (20, 18), (0, 26), (-20, 16)])
              o.append('<g transform="translate(70,70)" filter="url(#glow)" stroke="#fff" fill="none" stroke-width="2" stroke-linejoin="round">'
                       f'<polygon points="{pts}"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></polygon></g>')

              o.append('<g fill="#fff" font-weight="bold" filter="url(#glow)">')
              o.append('<text x="130" y="30" font-size="15">PONTUACAO</text>')
              for i, v in enumerate(values):
                  st = i * dt
                  e = (i + 1) * dt if i < len(values) - 1 else None
                  if len(values) == 1:
                      o.append(f'<text x="130" y="82" font-size="48">{fmt(v)}</text>')
                      continue
                  if i == 0:
                      kt, vv = f"0;{k(e)}", "1;0"
                  elif e is None:
                      kt, vv = f"0;{k(st)}", "0;1"
                  else:
                      kt, vv = f"0;{k(st)};{k(e)}", "0;1;0"
                  o.append(f'<text x="130" y="82" font-size="48" opacity="{"1" if i == 0 else "0"}">{fmt(v)}'
                           f'<animate attributeName="opacity" calcMode="discrete" keyTimes="{kt}" values="{vv}" dur="{D}s" repeatCount="indefinite"/></text>')
              o.append('</g>')

              conta = f"{total} ASTEROIDES x {PTS_PER_ASTEROID}  +  {stars} ESTRELAS x {PTS_PER_STAR}"
              if mult > 1:
                  conta += f"  +  COMBO x{mult}"
              o.append(f'<text x="130" y="104" fill="#fff" font-size="12" font-weight="bold">{conta}</text>')
              o.append(f'<text x="130" y="126" fill="#fff" opacity="0.6" font-size="10">{PTS_PER_ASTEROID} PTS POR ASTEROIDE · 12 MESES · ATUALIZADO {today}</text>')

              o.append('<g fill="#fff" font-weight="bold" text-anchor="end" filter="url(#glow)">')
              o.append(f'<text x="770" y="30" font-size="16">LV.{lvl:02d}  ·  {total} ASTEROIDES</text>')
              o.append(f'<text x="770" y="52" font-size="13">{rank}</text>')
              o.append('</g>')
              cw, gap, x0, y0 = 11, 3, 770 - (20 * 14 - 3), 62
              o.append('<g stroke="#fff" stroke-width="1.5" fill="none">')
              for c in range(cells):
                  o.append(f'<rect x="{x0 + c * (cw + gap)}" y="{y0}" width="{cw}" height="14"{" fill=" + chr(34) + "#fff" + chr(34) if c < filled else ""}/>')
              o.append('</g>')
              o.append(f'<text x="770" y="96" fill="#fff" font-size="11" text-anchor="end">{prox}</text>')
              o.append(f'<text x="770" y="118" fill="#fff" font-size="13" font-weight="bold" text-anchor="end">COMBO x{mult}  ·  SEQUENCIA: {streak} DIAS</text>')
              o.append('<rect width="800" height="140" fill="url(#scan)" pointer-events="none"/>')
              o.append('</svg>')
              return "\n".join(o), points


          # --------------------------------------------------------------------------- 2) mapa de batalha
          def build_map(s):
              weeks, total = s["weeks"], s["total"]
              placeholder = bool(os.environ.get("COUNTER_PLACEHOLDER"))
              cell, gap, x0, y0 = 11, 3, 29, 52
              step = cell + gap
              grid_w = max(len(weeks), 1) * step - gap
              counts = [d["contributionCount"] for w in weeks for d in w]
              active = sum(1 for c in counts if c > 0)
              best = max(counts) if counts else 0

              def opacity(c):
                  if c <= 0:
                      return None
                  return 0.35 if c == 1 else 0.6 if c <= 3 else 0.82 if c <= 6 else 1.0

              title = "AGUARDANDO RADAR..." if placeholder else f"MAPA DE BATALHA · {total} ASTEROIDES DESTRUIDOS"
              o = ['<?xml version="1.0" encoding="UTF-8"?>',
                   '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" font-family="Courier New, Courier, monospace">',
                   DEFS,
                   '<rect width="800" height="190" fill="#000"/>',
                   '<rect x="2" y="2" width="796" height="186" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>',
                   f'<text x="29" y="30" fill="#fff" font-size="15" font-weight="bold" filter="url(#glow)">{title}</text>']

              changes, last_month = [], None
              for wi, week in enumerate(weeks):
                  if not week:
                      continue
                  m = int(week[0]["date"][5:7])
                  if m != last_month:
                      changes.append((wi, m))
                      last_month = m
              if len(changes) > 1 and changes[1][0] - changes[0][0] < 3:  # evita "OUT" colado em "NOV"
                  changes = changes[1:]
              for wi, m in changes:
                  o.append(f'<text x="{x0 + wi * step}" y="46" fill="#fff" opacity="0.7" font-size="9">{MESES[m - 1]}</text>')

              o.append('<g filter="url(#glow)" stroke="#fff" stroke-width="1">')
              for wi, week in enumerate(weeks):
                  for d in week:
                      x, y = x0 + wi * step, y0 + d["weekday"] * step
                      op = opacity(d["contributionCount"])
                      if op is None:
                          o.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" fill="none" stroke-opacity="0.22"/>')
                      else:
                          o.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" fill="#fff" fill-opacity="{op}" stroke-opacity="{op}"/>')
              o.append('</g>')

              # varredura do radar
              o.append(f'<rect x="{x0 - 2}" y="{y0 - 3}" width="2" height="{7 * step + 3}" fill="#fff" opacity="0.45">'
                       f'<animateTransform attributeName="transform" type="translate" from="0 0" to="{grid_w} 0" dur="7s" repeatCount="indefinite"/></rect>')

              o.append(f'<text x="29" y="170" fill="#fff" font-size="12" font-weight="bold">DIAS DE COMBATE: {active}  ·  MELHOR DIA: {best} ASTEROIDES</text>')
              lx = 771 - 5 * step - 90
              o.append(f'<text x="{lx}" y="170" fill="#fff" opacity="0.7" font-size="10" text-anchor="end">MENOS</text>')
              for i, op in enumerate([None, 0.35, 0.6, 0.82, 1.0]):
                  x = lx + 6 + i * step
                  if op is None:
                      o.append(f'<rect x="{x}" y="160" width="{cell}" height="{cell}" fill="none" stroke="#fff" stroke-opacity="0.22"/>')
                  else:
                      o.append(f'<rect x="{x}" y="160" width="{cell}" height="{cell}" fill="#fff" fill-opacity="{op}" stroke="#fff" stroke-opacity="{op}"/>')
              o.append(f'<text x="{lx + 6 + 5 * step + 4}" y="170" fill="#fff" opacity="0.7" font-size="10">MAIS</text>')
              o.append('<rect width="800" height="190" fill="url(#scan)" pointer-events="none"/>')
              o.append('</svg>')
              return "\n".join(o)


          # --------------------------------------------------------------------------- ferramentas de desenho
          AST_PTS = "-20,-6 -10,-18 6,-16 20,-4 16,12 0,18 -16,12"
          SHIP_PTS = "0,-15 10,13 0,8 -10,13"


          def esc(s):
              return str(s).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;")


          def trunc(s, n):
              s = str(s)
              return s if len(s) <= n else s[: n - 1].rstrip() + "…"


          def wrap(text, size, max_w):
              cpl = max(int(max_w / (size * 0.6)), 8)
              lines, cur = [], ""
              for w in str(text).split():
                  if len(w) > cpl:
                      w = w[: cpl - 1] + "…"
                  if len(cur) + len(w) + (1 if cur else 0) <= cpl:
                      cur = (cur + " " + w).strip()
                  else:
                      lines.append(cur)
                      cur = w
              if cur:
                  lines.append(cur)
              return lines


          def T(x, y, s, size=13, anchor="start", weight="normal", op=1, fill="#fff"):
              o = f' opacity="{op}"' if op != 1 else ""
              return f'<text x="{x}" y="{y}" font-size="{size}" text-anchor="{anchor}" font-weight="{weight}" fill="{fill}"{o}>{esc(s)}</text>'


          def fmt_n(n):
              return f"{int(n):,}".replace(",", ".")


          def start(h, label):
              return ['<?xml version="1.0" encoding="UTF-8"?>',
                      f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 {h}" width="800" height="{h}" role="img" '
                      f'aria-label="{esc(label)}" font-family="Courier New, Courier, monospace">',
                      f"<title>{esc(label)}</title>", DEFS,
                      f'<rect width="800" height="{h}" fill="#000"/>',
                      f'<rect x="2" y="2" width="796" height="{h - 4}" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>']


          def end(o, h):
              o.append(f'<rect width="800" height="{h}" fill="url(#scan)" pointer-events="none"/>')
              o.append("</svg>")
              return "\n".join(o)


          def title(o, txt, sub=None):
              o.append(f'<g filter="url(#glow)">{T(28, 36, txt, 17, weight="bold")}</g>')
              o.append('<line x1="28" y1="46" x2="772" y2="46" stroke="#fff" stroke-opacity="0.5"/>')
              if sub:
                  o.append(T(28, 66, sub, 11, op=0.7))


          def explosion(x, y, t_hit, D, dur=0.55):
              """Faiscas em linha que se abrem quando o asteroide e atingido."""
              k = lambda t: f"{min(max(t / D, 0), 1):.4f}"
              lines = "".join(
                  f'<line x1="{4 * math.cos(math.radians(a)):.1f}" y1="{4 * math.sin(math.radians(a)):.1f}" '
                  f'x2="{11 * math.cos(math.radians(a + 10)):.1f}" y2="{11 * math.sin(math.radians(a + 10)):.1f}"/>'
                  for a in range(0, 360, 45))
              return (f'<g transform="translate({x},{y})" stroke="#fff" stroke-width="1.6"><g opacity="0">'
                      f'<animateTransform attributeName="transform" type="scale" keyTimes="0;{k(t_hit)};{k(t_hit + dur)};1" values="0.4;0.4;3;3" dur="{D}s" repeatCount="indefinite"/>'
                      f'<animate attributeName="opacity" calcMode="discrete" keyTimes="0;{k(t_hit)};{k(t_hit + dur)}" values="0;1;0" dur="{D}s" repeatCount="indefinite"/>{lines}</g></g>')


          def cycle_texts(x, y, items, size, slot, anchor="middle", weight="bold"):
              """Mostra um texto por vez (troca discreta), em loop."""
              if len(items) == 1:
                  return [T(x, y, items[0], size, anchor, weight)]
              D = slot * len(items)
              k = lambda t: f"{t / D:.4f}"
              out = []
              for i, txt in enumerate(items):
                  s_t, e_t = i * slot, (i + 1) * slot
                  if i == 0:
                      kt, vv = f"0;{k(e_t)}", "1;0"
                  elif i == len(items) - 1:
                      kt, vv = f"0;{k(s_t)}", "0;1"
                  else:
                      kt, vv = f"0;{k(s_t)};{k(e_t)}", "0;1;0"
                  out.append(f'<text x="{x}" y="{y}" font-size="{size}" text-anchor="{anchor}" font-weight="{weight}" fill="#fff" opacity="{"1" if i == 0 else "0"}">{esc(txt)}'
                             f'<animate attributeName="opacity" calcMode="discrete" keyTimes="{kt}" values="{vv}" dur="{D}s" repeatCount="indefinite"/></text>')
              return out


          def blink(x, y, txt, size, anchor="start", op=0.8):
              return (f'<text x="{x}" y="{y}" font-size="{size}" text-anchor="{anchor}" fill="#fff" opacity="{op}">{esc(txt)}'
                      f'<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.5" values="1;0" dur="1s" repeatCount="indefinite"/></text>')


          # --------------------------------------------------------------------------- 01) cabecalho
          def build_header(P):
