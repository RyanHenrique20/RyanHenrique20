                      o.append(f'<rect x="{x}" y="{y}" width="{sw}" height="{sh}" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-dasharray="4 4"/>')
                      o.append(T(x + 14, y + 34, "SLOT LIVRE · EM BREVE", 10, op=0.4))
