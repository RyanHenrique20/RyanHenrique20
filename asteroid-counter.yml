              items = [f"> {t.upper()}_" for t in P["typing"]] or [""]
              o.extend(cycle_texts(400, 206, items, 17, 2.6))
              o.append(blink(28, 238, "INSERT COIN", 11))
              o.append(T(772, 238, P["local"].upper(), 11, "end", op=0.7))
              return end(o, h)


