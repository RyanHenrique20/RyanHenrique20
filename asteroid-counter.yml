              o = start(h, f"{P['nome']} — {P['subtitulo']}")
              rnd = random.Random(5)
              for _ in range(42):
                  x, y, r = rnd.randint(14, 786), rnd.randint(70, 238), rnd.choice([0.8, 1, 1.4])
                  if 150 < x < 650 and 74 < y < 216:  # deixa o miolo livre para o texto
                      continue
                  o.append(f'<circle cx="{x}" cy="{y}" r="{r}" fill="#fff"><animate attributeName="opacity" values="0.15;1;0.15" '
                           f'dur="{rnd.uniform(1.5, 4):.1f}s" begin="{rnd.uniform(0, 3):.1f}s" repeatCount="indefinite"/></circle>')

              D2 = 4.0
              k2 = lambda t: f"{t / D2:.4f}"
              o.append('<g filter="url(#glow)" stroke="#fff" fill="none" stroke-width="2" stroke-linejoin="round">')
              o.append(f'<g transform="translate(62,40) rotate(90)"><polygon points="{SHIP_PTS}" fill="#000"/></g>')
              o.append(f'<g transform="translate(738,40)"><g><animate attributeName="opacity" calcMode="discrete" keyTimes="0;{k2(1.1)};{k2(2.2)}" values="1;0;1" dur="{D2}s" repeatCount="indefinite"/>'
                       f'<polygon points="{AST_PTS}"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></polygon></g></g>')
              o.append('</g>')
              o.append(f'<circle r="2.5" fill="#fff" opacity="0"><animateTransform attributeName="transform" type="translate" keyTimes="0;{k2(0.5)};{k2(1.1)};1" '
                       f'values="86,40;86,40;716,40;716,40" dur="{D2}s" repeatCount="indefinite"/>'
                       f'<animate attributeName="opacity" calcMode="discrete" keyTimes="0;{k2(0.5)};{k2(1.1)}" values="0;1;0" dur="{D2}s" repeatCount="indefinite"/></circle>')
              o.append(explosion(738, 40, 1.1, D2))

              o.append(f'<g filter="url(#glow)"><text x="400" y="118" font-size="56" text-anchor="middle" font-weight="bold" fill="#fff" letter-spacing="3">{esc(P["nome"].upper())}</text></g>')
              o.append(T(400, 152, P["subtitulo"].upper(), 15, "middle", op=0.85))
