          # --------------------------------------------------------------------------- 08) missoes (repositorios)
          def repo_status(r):
              now = datetime.datetime.now(datetime.timezone.utc)
              pushed = datetime.datetime.fromisoformat(r["pushedAt"].replace("Z", "+00:00"))
              if r.get("isArchived"):
                  return "CONCLUIDA"
              return "EM COMBATE" if (now - pushed).days <= 30 else "EM ORBITA"


          def mission_repos(repos):
              return [r for r in repos if r["name"].lower() != OWNER.lower()]


          def build_missions_svg(s):
              repos = mission_repos(s["repos"])[:6]
              y0, rh = 96, 54
              h = y0 + max(len(repos), 1) * rh + 44
              o = start(h, "Missões Ativas (Repositórios)")
              title(o, "MISSOES ATIVAS · MEUS REPOSITORIOS", "Cada repositório é uma missão. A lista se atualiza sozinha.")
              for x, txt, anc in [(28, "MISSAO", "start"), (268, "OBJETIVO", "start"), (520, "ARMA", "start"), (612, "ESTRELAS", "start"), (772, "STATUS", "end")]:
                  o.append(T(x, y0 - 8, txt, 9, anc, op=0.55))
              o.append(f'<line x1="28" y1="{y0 - 2}" x2="772" y2="{y0 - 2}" stroke="#fff" stroke-opacity="0.5"/>')
              if not repos:
                  o.append(T(400, y0 + 30, "NENHUMA MISSAO NO RADAR AINDA", 14, "middle", "bold"))
                  o.append(T(400, y0 + 52, "Crie um repositório público para abrir a primeira missão.", 11, "middle", op=0.6))
              for i, r in enumerate(repos):
                  y = y0 + i * rh
                  o.append(T(28, y + 18, f"MISSAO {i + 1:02d}", 9, op=0.55))
                  o.append(f'<g filter="url(#glow)">{T(28, y + 38, trunc(r["name"], 22), 15, weight="bold")}</g>')
                  desc = (r.get("description") or "Missão secreta (sem descrição ainda)").replace("\n", " ").strip()
                  dl = wrap(desc, 10.5, 232)
                  if len(dl) > 2:
                      dl = [dl[0], dl[1].rstrip(".,;: ")[:-1] + "…"]
                  for j, ln in enumerate(dl[:2]):
                      o.append(T(268, y + 24 + j * 14, ln, 10.5, op=0.8))
                  lang = (r.get("primaryLanguage") or {}).get("name") or "—"
                  o.append(T(520, y + 30, trunc(lang.upper(), 12), 11, weight="bold"))
