              o.append(f'<rect x="376" y="{y0}" width="396" height="{box_h}" fill="none" stroke="#fff" stroke-opacity="0.7"/>')
              o.append(T(44, y0 + 20, "FICHA DA NAVE", 10, op=0.6))
