                  else:
                      dash = ' stroke-dasharray="3 3"' if st == "CONCLUIDA" else ""
                      o.append(f'<rect x="668" y="{y + 15}" width="104" height="22" fill="none" stroke="#fff"{dash}/>')
                      o.append(T(720, y + 30, st, 11, "middle", "bold"))
                  o.append(f'<line x1="28" y1="{y + rh - 3}" x2="772" y2="{y + rh - 3}" stroke="#fff" stroke-opacity="0.18" stroke-dasharray="3 4"/>')
              o.append(T(28, h - 18, "EM COMBATE = MEXI NOS ULTIMOS 30 DIAS · EM ORBITA = PARADA · CONCLUIDA = ARQUIVADA", 9, op=0.55))
              return end(o, h)


          def build_links(repos):
              rs = mission_repos(repos)[:8]
              if not rs:
                  return ""
              return "**Entrar em combate:** " + " · ".join(f"[{r['name']}]({r['url']})" for r in rs)


          # --------------------------------------------------------------------------- 09) rodape
          def build_footer(P):
              h = 130
              o = start(h, "Game on")
              D2 = 4.0
              k2 = lambda t: f"{t / D2:.4f}"
              o.append('<g filter="url(#glow)" stroke="#fff" fill="none" stroke-width="2" stroke-linejoin="round">')
              o.append(f'<g transform="translate(60,64) rotate(90)"><polygon points="{SHIP_PTS}" fill="#000"/></g>')
              o.append(f'<g transform="translate(740,64)"><g><animate attributeName="opacity" calcMode="discrete" keyTimes="0;{k2(1.1)};{k2(2.2)}" values="1;0;1" dur="{D2}s" repeatCount="indefinite"/>'
                       f'<polygon points="{AST_PTS}"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/></polygon></g></g>')
              o.append('</g>')
              o.append(f'<circle r="2.5" fill="#fff" opacity="0"><animateTransform attributeName="transform" type="translate" keyTimes="0;{k2(0.5)};{k2(1.1)};1" '
                       f'values="84,64;84,64;718,64;718,64" dur="{D2}s" repeatCount="indefinite"/>'
                       f'<animate attributeName="opacity" calcMode="discrete" keyTimes="0;{k2(0.5)};{k2(1.1)}" values="0;1;0" dur="{D2}s" repeatCount="indefinite"/></circle>')
              o.append(explosion(740, 64, 1.1, D2))
              o.append(f'<g filter="url(#glow)">{T(400, 62, "GAME ON", 38, "middle", "bold")}</g>')
              o.append(blink(400, 92, "▶ PRESS START ◀", 14, "middle", 1))
              o.append(T(400, 116, f"© 2026 {P['nome'].upper()} · 1 COMMIT = 1 ASTEROIDE", 10, "middle", op=0.6))
              return end(o, h)


          # --------------------------------------------------------------------------- README (links das missoes)
          def update_readme(block):
              if not os.path.exists(README):
                  print(f"(sem {README} aqui, pulando os links das missões)")
                  return
              text = open(README, encoding="utf-8").read()
              pat = re.compile(r"(<!-- MISSOES:START -->).*?(<!-- MISSOES:END -->)", re.S)
              if not pat.search(text):
                  print("(marcadores MISSOES não encontrados no README, pulando)")
                  return
              new = pat.sub(lambda m: f"{m.group(1)}\n{block}\n{m.group(2)}", text)
              if new != text:
                  open(README, "w", encoding="utf-8").write(new)


          def main():
              P = load_profile()
              s = fetch()
              counter_svg, points = build_counter(s)
              files = {
                  os.path.join(PAGE_DIR, "header.svg"): build_header(P),
                  os.path.join(PAGE_DIR, "pilot.svg"): build_pilot(P),
                  os.path.join(PAGE_DIR, "arsenal.svg"): build_arsenal(P),
                  os.path.join(PAGE_DIR, "conquests.svg"): build_conquests(P),
                  os.path.join(PAGE_DIR, "rules.svg"): build_rules(),
                  os.path.join(PAGE_DIR, "radar.svg"): build_radar(s),
                  os.path.join(PAGE_DIR, "trophies.svg"): build_trophies(s),
                  os.path.join(PAGE_DIR, "missions.svg"): build_missions_svg(s),
                  os.path.join(PAGE_DIR, "footer.svg"): build_footer(P),
                  OUT_COUNTER: counter_svg,
                  OUT_MAP: build_map(s),
              }
              for name, content in build_buttons(P).items():
                  files[os.path.join(PAGE_DIR, name)] = content
              for path, content in files.items():
                  os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
              update_readme(build_links(s["repos"]))
              print(f"{len(files)} SVGs gerados · {s['total']} asteroides, {s['stars']} estrelas, sequência {s['streak']} dias "
                    f"-> {points} pontos · {len(s['repos'])} repositórios")


          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/build_page.py

      - name: Commit e push (com rebase para evitar rejeição)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A assets README.md
          if git diff --cached --quiet; then
            echo "Nada mudou, sem commit."
          else
            git commit -m "chore: página SVG atualizada"
            git pull --rebase
            git push
          fi
