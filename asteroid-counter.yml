                           f'dur="{rnd.uniform(1.2, 2.6):.1f}s" begin="{rnd.uniform(0, 2):.1f}s" repeatCount="indefinite"/></rect>')
              return end(o, h)


          # --------------------------------------------------------------------------- 04) conquistas
          def build_conquests(P):
              cs = P["conquistas"]
              n = len(cs)
              unlocked = sum(1 for c in cs if c["pct"] >= 100)
              prog = sum(1 for c in cs if 0 < c["pct"] < 100)
              locked = n - unlocked - prog
              overall = round(unlocked / n * 100) if n else 0
              y0, row_h = 84, 40
              foot = y0 + n * row_h + 14
              h = foot + 66
              o = start(h, "Sala de Conquistas")
              title(o, "SALA DE CONQUISTAS · METAS DA CAMPANHA", "Cada meta é uma conquista do jogo. Complete o requisito para desbloquear a medalha.")
              for i, c in enumerate(cs):
                  y = y0 + i * row_h
                  pct = max(0, min(100, int(c["pct"])))
                  op = 1 if pct > 0 else 0.45
                  o.append(T(28, y + 22, f"{i + 1:02d}", 11, op=0.5))
                  o.append(T(60, y + 16, trunc(c["nome"].upper(), 28), 13, weight="bold", op=op))
                  o.append(T(60, y + 31, trunc(f"{c['meta']} · {c['req']}", 62), 10, op=0.6 if pct > 0 else 0.35))
                  filled = round(pct / 100 * 20)
                  for k in range(20):
                      if k < filled:
                          o.append(f'<rect x="{500 + k * 7}" y="{y + 9}" width="6" height="14" fill="#fff"/>')
                      else:
                          o.append(f'<rect x="{500 + k * 7}" y="{y + 9}" width="6" height="14" fill="none" stroke="#fff" stroke-opacity="0.3"/>')
                  if pct >= 100:
                      o.append(f'<rect x="654" y="{y + 8}" width="118" height="16" fill="#fff"/>')
                      o.append(T(713, y + 20, "DESBLOQUEADA", 11, "middle", "bold", fill="#000"))
                  elif pct > 0:
                      o.append(T(772, y + 21, f"{pct}%", 14, "end", "bold"))
                  else:
                      o.append(T(772, y + 21, "BLOQUEADA", 11, "end", op=0.4))
                  if i == n - 1:
                      o.append(f'<rect x="20" y="{y - 2}" width="760" height="{row_h - 6}" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-dasharray="5 4"/>')
              o.append(f'<line x1="28" y1="{foot}" x2="772" y2="{foot}" stroke="#fff" stroke-opacity="0.5"/>')
              o.append(f'<g filter="url(#glow)">{T(28, foot + 26, f"PLACAR DA CAMPANHA: {unlocked} / {n} DESBLOQUEADAS · {prog} EM PROGRESSO · {locked} BLOQUEADAS", 13, weight="bold")}</g>')
              o.append(T(28, foot + 48, f"PROGRESSO GERAL: {overall}%   ·   RANK: {P['rank'].upper()}", 12, op=0.8))
              return end(o, h)


