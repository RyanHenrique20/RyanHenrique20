name: Space Shooter - Asteroid Defense
 
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
 
      # Cria a pasta assets/ caso ela ainda não exista no repositório
      - name: Criar pasta assets
        run: mkdir -p assets
 
      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'assets/space-shooter.gif'
          strategy: 'random'
          commit-message: 'chore: asteroides destruidos atualizados'
 
