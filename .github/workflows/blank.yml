name: Asteroid Counter

on:
  schedule:
    # 30 minutos depois do Space Shooter, para os dois não colidirem no push
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar contador de asteroides destruídos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_counter.py

      - name: Commit e push (com rebase para evitar rejeição)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/asteroid-counter.svg
          if git diff --cached --quiet; then
            echo "Nada mudou, sem commit."
          else
            git commit -m "chore: contador de asteroides atualizado"
            git pull --rebase
            git push
          fi
