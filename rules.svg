<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 254" width="800" height="254" role="img" aria-label="Regras do jogo" font-family="Courier New, Courier, monospace">
<title>Regras do jogo</title>
<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#fff" opacity="0.06"/></pattern></defs>
<rect width="800" height="254" fill="#000"/>
<rect x="2" y="2" width="796" height="250" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>
<g filter="url(#glow)"><text x="28" y="36" font-size="17" text-anchor="start" font-weight="bold" fill="#fff">REGRAS DO JOGO</text></g>
<line x1="28" y1="46" x2="772" y2="46" stroke="#fff" stroke-opacity="0.5"/>
<text x="44" y="84" font-size="13" text-anchor="start" font-weight="bold" fill="#fff">1 CONTRIBUICAO (COMMIT)</text>
<text x="756" y="84" font-size="13" text-anchor="end" font-weight="normal" fill="#fff">+100 PTS · 1 ASTEROIDE DESTRUIDO</text>
<line x1="28" y1="92" x2="772" y2="92" stroke="#fff" stroke-opacity="0.18" stroke-dasharray="3 4"/>
<text x="44" y="118" font-size="13" text-anchor="start" font-weight="bold" fill="#fff">7 DIAS SEGUIDOS</text>
<text x="756" y="118" font-size="13" text-anchor="end" font-weight="normal" fill="#fff">COMBO x2 NOS PONTOS DA SEQUENCIA</text>
<line x1="28" y1="126" x2="772" y2="126" stroke="#fff" stroke-opacity="0.18" stroke-dasharray="3 4"/>
<text x="44" y="152" font-size="13" text-anchor="start" font-weight="bold" fill="#fff">30 DIAS SEGUIDOS</text>
