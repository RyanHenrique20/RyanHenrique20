<line x1="28" y1="46" x2="772" y2="46" stroke="#fff" stroke-opacity="0.5"/>
<rect x="28" y="64" width="330" height="310" fill="none" stroke="#fff" stroke-opacity="0.7"/>
<rect x="376" y="64" width="396" height="310" fill="none" stroke="#fff" stroke-opacity="0.7"/>
