<text x="44" y="104" font-size="10" text-anchor="start" font-weight="normal" fill="#fff" opacity="0.6">PILOTO</text>
<text x="44" y="121" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">Ryan Henrique</text>
<line x1="44" y1="128" x2="342" y2="128" stroke="#fff" stroke-opacity="0.15"/>
<text x="44" y="144" font-size="10" text-anchor="start" font-weight="normal" fill="#fff" opacity="0.6">IDADE</text>
<text x="44" y="161" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">23 ciclos solares</text>
<line x1="44" y1="168" x2="342" y2="168" stroke="#fff" stroke-opacity="0.15"/>
<text x="44" y="184" font-size="10" text-anchor="start" font-weight="normal" fill="#fff" opacity="0.6">BASE</text>
<text x="44" y="201" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">São Paulo, Terra</text>
<line x1="44" y1="208" x2="342" y2="208" stroke="#fff" stroke-opacity="0.15"/>
<text x="44" y="224" font-size="10" text-anchor="start" font-weight="normal" fill="#fff" opacity="0.6">ACADEMIA</text>
<text x="44" y="241" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">UNICID</text>
<line x1="44" y1="248" x2="342" y2="248" stroke="#fff" stroke-opacity="0.15"/>
<text x="44" y="264" font-size="10" text-anchor="start" font-weight="normal" fill="#fff" opacity="0.6">MISSÃO</text>
<text x="44" y="281" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">Tornar-se Desenvolvedor Web</text>
<line x1="44" y1="288" x2="342" y2="288" stroke="#fff" stroke-opacity="0.15"/>
<text x="44" y="304" font-size="10" text-anchor="start" font-weight="normal" fill="#fff" opacity="0.6">COMBUSTÍVEL</text>
<text x="44" y="321" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">café + curiosidade</text>
<line x1="44" y1="328" x2="342" y2="328" stroke="#fff" stroke-opacity="0.15"/>
<text x="392" y="108" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">Fala! Eu sou o Ryan, tenho 23 anos, moro em</text>
<text x="392" y="126" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">São Paulo e estudo na UNICID. A tecnologia me</text>
<text x="392" y="144" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">conquistou de um jeito que virou rotina: gosto</text>
<text x="392" y="162" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">de entender como as coisas funcionam por</text>
<text x="392" y="180" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">baixo, construir projetos do zero e aprender</text>
<text x="392" y="198" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">com cada erro no caminho.</text>
<text x="392" y="226" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">Aqui no GitHub você acompanha meus projetos e</text>
<text x="392" y="244" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">a minha evolução como desenvolvedor.</text>
<text x="392" y="272" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">&gt; Cursando na UNICID</text>
<text x="392" y="290" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">&gt; Aprendendo e praticando todos os dias</text>
<text x="392" y="308" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">&gt; Foco em me tornar Desenvolvedor Web</text>
<text x="392" y="326" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">&gt; Vamos conversar? Me chama no LinkedIn ou por</text>
<text x="392" y="344" font-size="13" text-anchor="start" font-weight="normal" fill="#fff">  e-mail</text>
